# Offline protocol fixture, only used in the isolated provider benchmark.
x-fixture-provider: &fixture-provider
  LLM_API_KEY: ""
  EMBEDDING_API_KEY: ""
  LLM_BASE_URL: http://fixture:8080/v1
  EMBEDDING_BASE_URL: http://fixture:8080/v1
  LLM_MODEL: fixture-first-candidate
  EMBEDDING_MODEL: fixture-constant
services:
  fixture:
    image: enterprise-knowledge-desk:local
    pull_policy: never
    command: ["uvicorn", "evaluation.provider_fixture:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://localhost:8080/openapi.json')"]
      interval: 2s
      timeout: 3s
      retries: 20
  seed:
    environment: *fixture-provider
    depends_on:
      fixture: {condition: service_healthy}
  api:
    environment: *fixture-provider
  indexer:
    environment: *fixture-provider
