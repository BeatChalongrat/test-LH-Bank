name: Service regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: e5-${{ hashFiles('scripts/models.py') }}
      - run: python scripts/models.py
      - run: python -m pytest -q
  hr-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: models
          key: full-models-${{ hashFiles('scripts/models.py') }}
      - run: python scripts/configure.py
      - run: python scripts/models.py --llm
      - run: docker compose up -d --build --wait api indexer
      - run: python scripts/hr_demo.py setup
      - run: python scripts/hr_demo.py setup
      - run: python scripts/hr_demo.py verify
      - name: Show service startup diagnostics
        if: failure()
        run: docker compose logs --tail 60 api indexer
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAPACITY_PROJECT: provider-capacity
      CAPACITY_STATE_DIR: ./var/provider-capacity
      LLM_BASE_URL: http://fixture:8080/v1
      LLM_MODEL: fixture-first-candidate
      EMBEDDING_MODEL: fixture-constant
      COMPOSE_PROJECT_NAME: provider-capacity
      COMPOSE_FILE: compose.yaml:evaluation/capacity.compose.yaml:deploy/compose.provider.yaml:evaluation/provider-capacity.compose.yaml:evaluation/provider-fixture.compose.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p "$CAPACITY_STATE_DIR"
          echo "CAPACITY_UID_GID=$(id -u):$(id -g)" >> "$GITHUB_ENV"
          python scripts/configure.py
      - run: python -m pip install 'httpx==0.28.1'
      - run: docker compose up -d --build --wait api
      - name: Check all inference goes through HTTP
        run: |
          docker compose exec -T api python -c "from pathlib import Path; assert not list(Path('/models').glob('*.onnx'))"
          python -m evaluation.capacity --upstream http-fixture --chat --rps 2 --count 30 --out var/provider-capacity/smoke.json
      - name: Show service startup diagnostics
        if: failure()
        run: docker compose logs --tail 40 api seed fixture
