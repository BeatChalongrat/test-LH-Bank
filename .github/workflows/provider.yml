name: Hosted provider acceptance
on:
  workflow_dispatch:
    inputs:
      load:
        description: "Paid provider workload after HR and quality checks"
        type: choice
        options: [quality-only, office-180, peak-5000, soak-32400]
        default: quality-only
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: model-api
    timeout-minutes: 65
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      COMPOSE_FILE: compose.yaml:deploy/compose.provider.yaml
      CAPACITY_PROJECT: provider-live-capacity
      CAPACITY_STATE_DIR: ./var/provider-live-capacity
      LOAD_PROFILE: ${{ inputs.load }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check provider configuration
        run: |
          test -n "$LLM_BASE_URL" && test -n "$LLM_MODEL" && test -n "$EMBEDDING_MODEL" && test -n "$LLM_API_KEY"
      - run: python scripts/configure.py
      - run: docker compose up -d --build --wait api indexer
      - run: python scripts/hr_demo.py setup
      - run: python scripts/hr_demo.py verify
      - run: docker compose run --rm --no-deps -T seed python -m evaluation.run --out /state/provider-regression.json
      - run: docker compose run --rm --no-deps -T seed python -m evaluation.run --cases evaluation/validation.json --out /state/provider-validation.json
      - name: Run selected load profile on a separate database
        if: inputs.load != 'quality-only'
        run: |
          python -m pip install 'httpx==0.28.1'
          docker compose -p "$CAPACITY_PROJECT" -f compose.yaml -f evaluation/capacity.compose.yaml -f deploy/compose.provider.yaml -f evaluation/provider-capacity.compose.yaml up -d --wait api
          case "$LOAD_PROFILE" in
            office-180) count=180; rps=2 ;;
            peak-5000) count=5000; rps=18 ;;
            soak-32400) count=32400; rps=18 ;;
            *) exit 2 ;;
          esac
          python -m evaluation.capacity --upstream hosted --chat --count "$count" --rps "$rps" --out evaluation/provider-live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-acceptance
          path: |
            var/compose/provider-regression.json
            var/compose/provider-validation.json
            evaluation/provider-live.json
            var/provider-live-capacity/provider-live.jsonl
